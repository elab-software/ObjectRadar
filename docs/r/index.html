<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ObjectRadar – Redirection</title>

    <meta name="robots" content="noindex, nofollow">
</head>

<body>

    <div class="redirect-message">
        <img src="../html/images/logo/app-icon-Object-Radar-512.png"
            alt="ObjectRadar"
            class="logo"
            width="5%">

        <span id="redirect-message">Redirection en cours…</span>
    </div>

    <!-- GoatCounter must insert before the redirection script in order to transmit a temporary URL with counting parameters -->
    <script
        data-goatcounter="https://objectradar.goatcounter.com/count"
        data-goatcounter-settings='{"no_onload":true}'
        src="https://gc.zgo.at/count.js">
    </script>

    <script src="./redirect.js"></script>

</body>
</html>
